[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "akadi-hermetic-mvp"
version = "0.3.0"
description = "Capa externa auditable para orquestar y evaluar LLMs comerciales opacos (ventana de chat, sin API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Pendiente de definir por el custodio" }
dependencies = []

[project.scripts]
akadi = "akadi.cli:main"

[tool.setuptools.packages.find]
include = ["akadi*"]
